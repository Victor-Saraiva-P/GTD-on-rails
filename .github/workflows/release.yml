name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'app-v*'

jobs:
  publish:
    name: Build & Publish Release
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check app version sync
        run: pnpm version:check

      - name: Build Tauri app
        run: pnpm run desktop:build:ci
        working-directory: apps/desktop

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "GTD on Rails Desktop ${GITHUB_REF_NAME}" \
              --notes "See the assets to download this version and install."

      - name: Package native Linux tarball
        run: pnpm run desktop:package:native-linux
        working-directory: apps/desktop

      - name: Verify release asset versions match tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tag_version="${tag_version#app-v}"
          printf 'Tag version: %s\n' "$tag_version"
          test -f "src-tauri/target/release/native/GTD.on.Rails_${tag_version}_linux-x86_64.tar.gz" || { echo "native tarball does not match tag version"; exit 1; }
          test -f "src-tauri/target/release/native/GTD.on.Rails_${tag_version}_linux-x86_64.tar.gz.sha256" || { echo "native sha256 does not match tag version"; exit 1; }
        working-directory: apps/desktop

      - name: Upload native Linux tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            apps/desktop/src-tauri/target/release/native/*.tar.gz \
            apps/desktop/src-tauri/target/release/native/*.tar.gz.sha256 \
            --clobber
