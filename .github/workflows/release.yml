name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'app-v*'

jobs:
  publish:
    name: Build & Publish Release
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            apps/cli/target
          key: ${{ runner.os }}-rust-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/cli/Cargo.lock') }}

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check app version sync
        run: pnpm version:check

      - name: Reuse validated main desktop package
        id: main-desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          temp_dir="$RUNNER_TEMP/gtd-main-release"
          native_dir="apps/desktop/src-tauri/target/release/native"
          mkdir -p "$temp_dir" "$native_dir"
          if ! gh release download main-latest --pattern main-update.json --dir "$temp_dir" --clobber; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          tag_version="${tag_version#app-v}"
          manifest_version="$(jq -r '.version' "$temp_dir/main-update.json")"
          manifest_revision="$(jq -r '.revision' "$temp_dir/main-update.json")"
          if [ "$manifest_version" != "$tag_version" ] || [ "$manifest_revision" != "$GITHUB_SHA" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          archive="$(jq -r '.archiveName' "$temp_dir/main-update.json")"
          checksum="$(jq -r '.checksumName' "$temp_dir/main-update.json")"
          gh release download main-latest \
            --pattern "$archive" \
            --pattern "$checksum" \
            --dir "$native_dir" \
            --clobber
          echo "reuse=true" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        if: steps.main-desktop.outputs.reuse != 'true'
        run: pnpm run desktop:build:ci
        working-directory: apps/desktop
        env:
          GTD_BUILD_REVISION: ${{ github.sha }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "GTD on Rails ${GITHUB_REF_NAME}" \
              --notes "Release assets include the desktop application, standalone GTD CLI, and standalone sync client."

      - name: Package native Linux tarball
        if: steps.main-desktop.outputs.reuse != 'true'
        run: pnpm run desktop:package:native-linux
        working-directory: apps/desktop

      - name: Package standalone GTD CLI
        run: bash scripts/package-linux.sh
        working-directory: apps/cli

      - name: Build sync client
        run: ./gradlew --no-daemon bootJar
        working-directory: apps/sync-server

      - name: Package sync client
        run: bash scripts/package-client-linux.sh
        working-directory: apps/sync-server

      - name: Verify release asset versions match tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tag_version="${tag_version#app-v}"
          printf 'Tag version: %s\n' "$tag_version"
          test -f "src-tauri/target/release/native/GTD.on.Rails_${tag_version}_linux-x86_64.tar.gz" || { echo "native tarball does not match tag version"; exit 1; }
          test -f "src-tauri/target/release/native/GTD.on.Rails_${tag_version}_linux-x86_64.tar.gz.sha256" || { echo "native sha256 does not match tag version"; exit 1; }
          test -f "../cli/target/release-package/GTD.on.Rails.CLI_${tag_version}_linux-x86_64.tar.gz" || { echo "CLI tarball does not match tag version"; exit 1; }
          test -f "../cli/target/release-package/GTD.on.Rails.CLI_${tag_version}_linux-x86_64.tar.gz.sha256" || { echo "CLI sha256 does not match tag version"; exit 1; }
          test -f "../sync-server/build/client-release/GTD.on.Rails.Client_${tag_version}_linux-x86_64.tar.gz" || { echo "client tarball does not match tag version"; exit 1; }
          test -f "../sync-server/build/client-release/GTD.on.Rails.Client_${tag_version}_linux-x86_64.tar.gz.sha256" || { echo "client sha256 does not match tag version"; exit 1; }
        working-directory: apps/desktop

      - name: Upload native Linux tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            apps/desktop/src-tauri/target/release/native/*.tar.gz \
            apps/desktop/src-tauri/target/release/native/*.tar.gz.sha256 \
            apps/cli/target/release-package/*.tar.gz \
            apps/cli/target/release-package/*.tar.gz.sha256 \
            apps/sync-server/build/client-release/*.tar.gz \
            apps/sync-server/build/client-release/*.tar.gz.sha256 \
            --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

