name: Promote Staging to Production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "40-character Git commit SHA homologated in staging"
        required: true
        type: string
      confirmation:
        description: "Type PROMOTE to confirm production rollout"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote exact approved artifacts
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPROVED_REVISION: ${{ inputs.revision }}
      PROMOTION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Require explicit approval and a commit from main
        shell: bash
        run: |
          set -euo pipefail
          test "$PROMOTION_CONFIRMATION" = "PROMOTE"
          [[ "$APPROVED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$APPROVED_REVISION" origin/main

      - name: Download approved candidate manifest and verify revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh release download staging-latest --pattern main-update.json --dir candidate
          test "$(jq -r '.revision' candidate/main-update.json)" = "$APPROVED_REVISION"
          test "$(jq -r '.version' candidate/main-update.json)" != "null"

      - name: Download and verify the exact staging archives
        shell: bash
        run: |
          set -euo pipefail
          for key in archiveName checksumName cliArchiveName cliChecksumName clientArchiveName clientChecksumName; do
            file="$(jq -r --arg key "$key" '.[$key]' candidate/main-update.json)"
            [[ "$file" =~ ^[a-zA-Z0-9._-]+$ ]]
            test "$file" != "null"
            gh release download staging-latest --pattern "$file" --dir candidate
          done
          (
            cd candidate
            for key in checksumName cliChecksumName clientChecksumName; do
              checksum="$(jq -r --arg key "$key" '.[$key]' main-update.json)"
              sha256sum -c "$checksum"
            done
          )
          # Abort if a concurrent CI publish replaced the candidate while downloading it.
          gh release download staging-latest --pattern main-update.json --dir "$RUNNER_TEMP" --clobber
          cmp candidate/main-update.json "$RUNNER_TEMP/main-update.json"

      - name: Publish immutable binaries before switching production manifest
        shell: bash
        run: |
          set -euo pipefail
          gh release view main-latest >/dev/null 2>&1 || gh release create main-latest \
            --prerelease --target "$APPROVED_REVISION" \
            --title "GTD on Rails production" \
            --notes "Production artifacts require explicit staging approval."
          gh release edit main-latest \
            --prerelease --target "$APPROVED_REVISION" \
            --title "GTD on Rails production" \
            --notes "Promoted from staging revision $APPROVED_REVISION."
          files=()
          for key in archiveName checksumName cliArchiveName cliChecksumName clientArchiveName clientChecksumName; do
            name="$(jq -r --arg key "$key" '.[$key]' candidate/main-update.json)"
            files+=("candidate/$name")
          done
          gh release upload main-latest "${files[@]}" --clobber
          # The updater reads this manifest: upload it LAST to activate the candidate.
          gh release upload main-latest candidate/main-update.json --clobber
