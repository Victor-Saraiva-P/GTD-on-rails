name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check app version sync
        run: pnpm version:check

      - name: Install Playwright browser
        run: pnpm --filter @gtd-on-rails/desktop e2e:install:ci

      - name: Run tests
        run: pnpm test

  static-check:
    name: Static Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

  desktop-native:
    name: Desktop Native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
            apps/cli/target
          key: ${{ runner.os }}-rust-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/cli/Cargo.lock') }}

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check app version sync
        run: pnpm version:check

      - name: Build desktop app
        run: pnpm --filter @gtd-on-rails/desktop desktop:build:ci
        env:
          GTD_BUILD_REVISION: ${{ github.sha }}

      - name: Package native Linux tarball
        run: pnpm --filter @gtd-on-rails/desktop desktop:package:native-linux

      - name: Upload main desktop package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-desktop-package
          path: |
            apps/desktop/src-tauri/target/release/native/*.tar.gz
            apps/desktop/src-tauri/target/release/native/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  publish-main:
    name: Publish Main Update
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - check
      - static-check
      - desktop-native
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download desktop package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-desktop-package
          path: rolling-native

      - name: Create main update manifest
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: |
          version="$(cat VERSION)"
          archive="GTD.on.Rails_${version}_linux-x86_64.tar.gz"
          checksum="${archive}.sha256"
          test -f "rolling-native/${archive}"
          test -f "rolling-native/${checksum}"
          jq -n \
            --arg version "$version" \
            --arg revision "$BUILD_REVISION" \
            --arg archiveName "$archive" \
            --arg checksumName "$checksum" \
            '{version: $version, revision: $revision, archiveName: $archiveName, checksumName: $checksumName}' \
            > rolling-native/main-update.json

      - name: Publish rolling main release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view main-latest >/dev/null 2>&1 || \
            gh release create main-latest \
              --prerelease \
              --target main \
              --title "GTD on Rails main" \
              --notes "Rolling build from the latest validated main commit."
          gh release edit main-latest \
            --prerelease \
            --title "GTD on Rails main" \
            --notes "Rolling build for commit ${GITHUB_SHA}."
          gh release upload main-latest \
            rolling-native/*.tar.gz \
            rolling-native/*.tar.gz.sha256 \
            rolling-native/main-update.json \
            --clobber
