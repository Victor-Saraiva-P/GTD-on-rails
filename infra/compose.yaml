services:
  postgres:
    image: postgres:17-alpine
    container_name: gtd-on-rails-postgres
    environment:
      POSTGRES_DB: gtd_on_rails
      POSTGRES_USER: gtd
      POSTGRES_PASSWORD: gtd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtd -d gtd_on_rails"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
