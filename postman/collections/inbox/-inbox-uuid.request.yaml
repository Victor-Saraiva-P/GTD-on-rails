$kind: http-request
name: /inbox/{{item_id}}
url: "{{backend_url}}/inbox/{{item_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      if (pm.response && pm.response.code) {
        try {
          const data = pm.response.json();
          if (data && data.id) {
            pm.environment.set("item_id", data.id);
          }
        } catch (e) {
          // response is not JSON
        }
      }
    language: text/javascript
order: 2500
