$kind: http-request
name: /contexts
url: "{{backend_url}}/contexts"
method: POST
body:
  type: json
  content: |-
    {
        "name": "faculdade"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |
      if (pm.response && pm.response.code) {
          try {
              const data = pm.response.json();
              if (data && data.id) { pm.environment.set("context_id", data.id); }
          } catch (e) {
              // response is not JSON
          }
      }
    language: text/javascript
order: 1000
