gtd.data.root-directory=${GTD_DATA_ROOT_DIRECTORY:${user.home}/Documents/${GTD_DATA_ROOT_DIRECTORY_NAME:ci-gtd-on-rails}}
gtd.persistence.bootstrap.enabled=false
gtd.persistence.bootstrap.branch=dev
gtd.persistence.sync.enabled=${GTD_PERSISTENCE_SYNC_ENABLED:false}
gtd.persistence.sync.interval-ms=${GTD_PERSISTENCE_SYNC_INTERVAL_MS:300000}
gtd.persistence.sync.commit-author-name=${GTD_PERSISTENCE_SYNC_COMMIT_AUTHOR_NAME:GTD on Rails CI}
gtd.persistence.sync.commit-author-email=${GTD_PERSISTENCE_SYNC_COMMIT_AUTHOR_EMAIL:gtdonrails-ci@local}
gtd.assets.rclone.enabled=${GTD_ASSETS_RCLONE_ENABLED:false}
gtd.assets.rclone.command=${GTD_ASSETS_RCLONE_COMMAND:rclone}
gtd.assets.rclone.remote=${GTD_ASSETS_RCLONE_REMOTE:gdrive:ci-gtd-on-rails}
gtd.assets.sync.interval-ms=${GTD_ASSETS_SYNC_INTERVAL_MS:300000}
gtd.assets.sync.force=false
gtd.cleanup.enabled=false
