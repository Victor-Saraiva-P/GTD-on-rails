gtd.data.root-directory=${GTD_DATA_ROOT_DIRECTORY:${user.home}/Documents/${GTD_DATA_ROOT_DIRECTORY_NAME:gtd-on-rails}}
# WHY: Local SQLite file lives under the data root for sub-millisecond local access.
# The previous database.properties import is kept to read Supabase connection info
# for the async sync worker.
spring.datasource.url=jdbc:sqlite:${gtd.data.root-directory}/gtd.db
spring.config.import=optional:file:${gtd.data.root-directory}/database.properties
spring.flyway.locations=classpath:db/sqlite-migration
# WHY: Bootstrap creates database_identity before Flyway's first run,
# so the schema is non-empty when Flyway initializes its schema history table.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.placeholders.databaseIdentity=PRODUCTION
spring.flyway.placeholders.databaseEnvironment=PRODUCTION
gtd.database.environment=PRODUCTION
gtd.sync.rclone.enabled=${GTD_SYNC_RCLONE_ENABLED:true}
gtd.sync.rclone.command=${GTD_SYNC_RCLONE_COMMAND:rclone}
gtd.sync.rclone.remote=${GTD_SYNC_RCLONE_REMOTE:gdrive:gtd-on-rails}
gtd.sync.interval-ms=${GTD_SYNC_INTERVAL_MS:300000}
gtd.sync.force=${GTD_SYNC_FORCE:true}
gtd.backup.directory=${GTD_BACKUP_DIRECTORY:${gtd.data.root-directory}/backups}
gtd.backup.daily-cron=${GTD_BACKUP_DAILY_CRON:0 0 2 * * *}
# WHY: Enable async outbox sync from local SQLite to remote Supabase in production.
# Supabase connection info comes from database.properties imported above.
gtd.sync.database.enabled=${GTD_SYNC_DATABASE_ENABLED:true}
gtd.sync.database.supabase.url=${spring.datasource.supabase.url:}
gtd.sync.database.supabase.username=${spring.datasource.supabase.username:}
gtd.sync.database.supabase.password=${spring.datasource.supabase.password:}
