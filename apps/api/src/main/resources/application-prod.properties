gtd.data.root-directory=${GTD_DATA_ROOT_DIRECTORY:${user.home}/Documents/${GTD_DATA_ROOT_DIRECTORY_NAME:gtd-on-rails}}
spring.config.import=optional:file:${gtd.data.root-directory}/database.properties
gtd.sync.rclone.enabled=${GTD_SYNC_RCLONE_ENABLED:true}
gtd.sync.rclone.command=${GTD_SYNC_RCLONE_COMMAND:rclone}
gtd.sync.rclone.remote=${GTD_SYNC_RCLONE_REMOTE:gdrive:gtd-on-rails}
gtd.sync.interval-ms=${GTD_SYNC_INTERVAL_MS:300000}
gtd.sync.force=${GTD_SYNC_FORCE:true}
gtd.backup.directory=${GTD_BACKUP_DIRECTORY:${gtd.data.root-directory}/backups}
gtd.backup.daily-cron=${GTD_BACKUP_DAILY_CRON:0 0 2 * * *}
spring.flyway.default-schema=gtd
spring.flyway.schemas=gtd
spring.flyway.locations=classpath:db/postgresql-migration
# WHY: Bootstrap creates database_identity and database_cutover before Flyway's first run,
# so the schema is non-empty when Flyway initializes its schema history table.
# baselineVersion=0 ensures V1 (which creates all application tables) still runs;
# the bootstrap tables in V1/V2 use IF NOT EXISTS / ON CONFLICT so re-execution is safe.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.placeholders.databaseIdentity=PRODUCTION
spring.flyway.placeholders.databaseEnvironment=PRODUCTION
gtd.database.environment=PRODUCTION
