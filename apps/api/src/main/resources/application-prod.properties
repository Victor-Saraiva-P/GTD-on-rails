gtd.data.root-directory=${GTD_DATA_ROOT_DIRECTORY:${user.home}/Documents/${GTD_DATA_ROOT_DIRECTORY_NAME:gtd-on-rails}}
# WHY: Local SQLite file lives under the data root for sub-millisecond local access.
# for the async sync worker.
spring.datasource.url=jdbc:sqlite:${gtd.data.root-directory}/gtd.db
spring.flyway.locations=classpath:db/sqlite-migration
# WHY: Bootstrap creates database_identity before Flyway's first run,
# so the schema is non-empty when Flyway initializes its schema history table.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.placeholders.databaseIdentity=PRODUCTION
spring.flyway.placeholders.databaseEnvironment=PRODUCTION
gtd.database.environment=PRODUCTION
gtd.backup.directory=${GTD_BACKUP_DIRECTORY:${gtd.data.root-directory}/backups}
gtd.backup.daily-cron=${GTD_BACKUP_DAILY_CRON:0 0 2 * * *}
gtd.sync.server.enabled=${GTD_SYNC_SERVER_ENABLED:true}
gtd.sync.server.base-url=${GTD_SYNC_SERVER_BASE_URL:http://127.0.0.1:9473}
gtd.sync.file-interval-ms=${GTD_SYNC_FILE_INTERVAL_MS:5000}
