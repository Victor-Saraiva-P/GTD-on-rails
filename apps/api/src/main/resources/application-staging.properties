gtd.data.root-directory=${GTD_DATA_ROOT_DIRECTORY:${user.dir}/staging-gtd-on-rails}
spring.datasource.url=jdbc:sqlite:${gtd.data.root-directory}/gtd.db
spring.config.import=optional:file:${gtd.data.root-directory}/database.properties
spring.flyway.locations=classpath:db/sqlite-migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.placeholders.databaseIdentity=STAGING
spring.flyway.placeholders.databaseEnvironment=STAGING
gtd.database.environment=STAGING
gtd.sync.rclone.enabled=${GTD_SYNC_RCLONE_ENABLED:true}
gtd.sync.rclone.command=${GTD_SYNC_RCLONE_COMMAND:rclone}
gtd.sync.rclone.remote=${GTD_SYNC_RCLONE_REMOTE:gdrive:staging-gtd-on-rails}
gtd.sync.interval-ms=${GTD_SYNC_INTERVAL_MS:300000}
gtd.sync.force=${GTD_SYNC_FORCE:true}
gtd.backup.directory=${GTD_BACKUP_DIRECTORY:${gtd.data.root-directory}/backups}
gtd.staging.reset=${GTD_STAGING_RESET:false}
gtd.sync.database.enabled=${GTD_SYNC_DATABASE_ENABLED:true}
gtd.sync.database.supabase.url=${spring.datasource.supabase.url:}
gtd.sync.database.supabase.username=${spring.datasource.supabase.username:}
gtd.sync.database.supabase.password=${spring.datasource.supabase.password:}
