gtd.data.root-directory=${GTD_DATA_ROOT_DIRECTORY:${user.dir}/../../dev-gtd-on-rails}
# WHY: Local SQLite file lives under the data root, using the same directory
# structure the user already knows. No external database server needed for dev.
spring.datasource.url=jdbc:sqlite:${gtd.data.root-directory}/gtd.db
spring.flyway.locations=classpath:db/sqlite-migration
spring.flyway.placeholders.databaseIdentity=DEVELOPMENT
spring.flyway.placeholders.databaseEnvironment=DEVELOPMENT
gtd.database.environment=DEVELOPMENT
gtd.sync.rclone.enabled=${GTD_SYNC_RCLONE_ENABLED:false}
gtd.sync.rclone.command=${GTD_SYNC_RCLONE_COMMAND:rclone}
gtd.sync.rclone.remote=${GTD_SYNC_RCLONE_REMOTE:gdrive:dev-gtd-on-rails}
gtd.sync.interval-ms=${GTD_SYNC_INTERVAL_MS:300000}
gtd.sync.force=${GTD_SYNC_FORCE:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:1420,http://localhost:1420}
# WHY: Database sync disabled in dev to avoid requiring Supabase connectivity.
gtd.sync.database.enabled=false
