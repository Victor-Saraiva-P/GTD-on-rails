spring.application.name=api
spring.datasource.url=jdbc:sqlite:${gtd.persistence.bootstrap.clone-directory}/db/gtd-on-rails.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:30MB}
spring.web.resources.add-mappings=false
api.project-name=https://gtdonrails.local
api.base-url=/errors
gtd.persistence.bootstrap.repository-url=https://github.com/Victor-Saraiva-P/gtd-persistence.git
gtd.data.root-directory=${GTD_DATA_ROOT_DIRECTORY:${user.home}/Documents/${GTD_DATA_ROOT_DIRECTORY_NAME:dev-gtd-on-rails}}
gtd.persistence.bootstrap.clone-directory=${gtd.data.root-directory}/persistence
gtd.persistence.sync.enabled=${GTD_PERSISTENCE_SYNC_ENABLED:true}
gtd.persistence.sync.interval-ms=${GTD_PERSISTENCE_SYNC_INTERVAL_MS:300000}
gtd.persistence.sync.commit-author-name=${GTD_PERSISTENCE_SYNC_COMMIT_AUTHOR_NAME:GTD on Rails}
gtd.persistence.sync.commit-author-email=${GTD_PERSISTENCE_SYNC_COMMIT_AUTHOR_EMAIL:gtdonrails@local}
gtd.assets.local-directory=${GTD_ASSETS_LOCAL_DIRECTORY:${gtd.data.root-directory}/assets}
gtd.assets.sync.state-directory=${GTD_ASSETS_SYNC_STATE_DIRECTORY:${gtd.data.root-directory}/asset-sync-state}
