spring.application.name=api
# WHY: Primary datasource is local SQLite for sub-millisecond reads/writes.
# The remote Supabase PostgreSQL is accessed only by the async outbox sync worker.
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/sqlite-migration
spring.jpa.hibernate.ddl-auto=validate
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:30MB}
spring.web.resources.add-mappings=false
gtd.database.environment=${GTD_DATABASE_ENVIRONMENT:PRODUCTION}
api.project-name=https://gtdonrails.local
api.base-url=/errors
gtd.assets.local-directory=${GTD_ASSETS_LOCAL_DIRECTORY:${gtd.data.root-directory}/assets}
gtd.sync.sync-check-filename=gtd-on-rails-sync-check
gtd.cleanup.enabled=${GTD_CLEANUP_ENABLED:true}
gtd.cleanup.retention-days=${GTD_CLEANUP_RETENTION_DAYS:30}
gtd.schema.min-supported-version=${GTD_SCHEMA_MIN_SUPPORTED_VERSION:1}
gtd.schema.max-supported-version=${GTD_SCHEMA_MAX_SUPPORTED_VERSION:1}
# WHY: Database sync defaults to disabled; enabled per-profile in prod/staging.
gtd.sync.database.enabled=${GTD_SYNC_DATABASE_ENABLED:false}
gtd.sync.database.interval-ms=${GTD_SYNC_DATABASE_INTERVAL_MS:5000}
