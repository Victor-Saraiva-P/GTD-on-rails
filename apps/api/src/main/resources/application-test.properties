spring.datasource.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true
spring.web.resources.add-mappings=false
spring.flyway.locations=classpath:db/sqlite-migration
spring.flyway.placeholders.databaseIdentity=TEST
spring.flyway.placeholders.databaseEnvironment=TEST
gtd.database.environment=TEST
api.project-name=https://gtdonrails.local
api.base-url=/errors
gtd.data.root-directory=./build/data
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:1420,http://localhost:1420}
gtd.assets.local-directory=./build/data/assets
gtd.sync.rclone.enabled=${GTD_SYNC_RCLONE_ENABLED:false}
gtd.sync.interval-ms=300000
gtd.sync.sync-check-filename=gtd-on-rails-sync-check
gtd.sync.force=false
gtd.cleanup.enabled=false
gtd.cleanup.retention-days=30
gtd.google.token-encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
# WHY: Database sync disabled in tests to avoid requiring Supabase connectivity.
gtd.sync.database.enabled=false
