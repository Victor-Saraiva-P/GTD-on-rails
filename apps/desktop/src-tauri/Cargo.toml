[package]
name = "desktop"
version = "2.1.2"
description = "Desktop shell for GTD on Rails"
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22"
gdk-pixbuf = "0.18"
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3", default-features = false, features = ["wry"] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-shell = "2.3.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
