spring.application.name=gtd-sync-server
server.address=${GTD_SYNC_SERVER_BIND_ADDRESS:127.0.0.1}
server.port=${GTD_SYNC_SERVER_PORT:9473}
gtd.sync-server.data-root=${GTD_SYNC_SERVER_DATA_ROOT:${user.home}/.local/share/gtd-on-rails-sync-server}
gtd.sync-server.database-path=${GTD_SYNC_SERVER_DATABASE_PATH:${gtd.sync-server.data-root}/canonical.db}
gtd.sync-server.files-root=${GTD_SYNC_SERVER_FILES_ROOT:${gtd.sync-server.data-root}/files}
gtd.sync-server.backup-directory=${GTD_SYNC_SERVER_BACKUP_DIRECTORY:${gtd.sync-server.data-root}/backups}
gtd.sync-server.backup-cron=${GTD_SYNC_SERVER_BACKUP_CRON:0 0 2 * * *}
gtd.sync-server.rclone.enabled=${GTD_SYNC_SERVER_RCLONE_ENABLED:false}
gtd.sync-server.rclone.command=${GTD_SYNC_SERVER_RCLONE_COMMAND:rclone}
gtd.sync-server.rclone.remote=${GTD_SYNC_SERVER_RCLONE_REMOTE:gdrive:gtd-on-rails-backups}
gtd.sync-server.auth-token=${GTD_SYNC_SERVER_AUTH_TOKEN:}
gtd.sync-server.public-base-url=${GTD_SYNC_SERVER_PUBLIC_BASE_URL:http://127.0.0.1:${GTD_SYNC_SERVER_PORT:9473}}
gtd.sync-server.google-calendar.interval-ms=${GTD_GOOGLE_CALENDAR_SYNC_INTERVAL_MS:5000}
gtd.client.install-dir=${GTD_CLIENT_INSTALL_DIR:}
gtd.client.auto-update.enabled=${GTD_CLIENT_AUTO_UPDATE_ENABLED:true}
gtd.client.auto-update.initial-delay-ms=${GTD_CLIENT_AUTO_UPDATE_INITIAL_DELAY_MS:30000}
gtd.client.auto-update.interval-ms=${GTD_CLIENT_AUTO_UPDATE_INTERVAL_MS:21600000}
gtd.client.release-url=${GTD_CLIENT_RELEASE_URL:https://api.github.com/repos/Victor-Saraiva-P/GTD-on-rails/releases/latest}
