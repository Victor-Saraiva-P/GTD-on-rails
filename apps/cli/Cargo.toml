[package]
name = "gtd-cli"
version = "3.6.1"
edition = "2024"

[[bin]]
name = "gtd"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.48", features = ["derive", "env"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
url = "2.5.7"

[dev-dependencies]
tempfile = "3.23.0"
